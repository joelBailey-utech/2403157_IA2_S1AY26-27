<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coding Conf 2026 | Register</title>
  <link rel="icon" href="../assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="page-form">
  <img class="deco deco-circle" src="../assets/images/pattern-circle.svg" alt="" aria-hidden="true">
  <img class="deco deco-top" src="../assets/images/pattern-squiggly-line-top.svg" alt="" aria-hidden="true">
  <img class="deco deco-bottom" src="../assets/images/pattern-squiggly-line-bottom-desktop.svg" alt="" aria-hidden="true">

  <header class="site-header">
    <a href="index.html" aria-label="Coding Conf home">
      <img src="../assets/images/logo-full.svg" alt="Coding Conf logo" class="logo">
    </a>
  </header>

  <main>
    <section class="hero" aria-labelledby="form-title">
      <h1 id="form-title">Your Journey to Coding Conf 2026 Starts Here!</h1>
      <p class="lead">Secure your spot at this year's biggest coding conference.</p>
    </section>

    <section aria-label="Registration form">
      <!-- novalidate: all checks are done by validation.js -->
      <form id="registration-form" class="form" novalidate>

        <div class="field">
          <label for="avatar">Upload Avatar</label>
          <div class="dropzone">
            <img src="../assets/images/icon-upload.svg" alt="" aria-hidden="true" class="dropzone-icon" id="dropzone-icon">
            <img alt="Avatar preview" class="dropzone-preview" id="avatar-preview" hidden>
            <p id="dropzone-text">Drag and drop or click to upload</p>
            <input type="file" id="avatar" name="avatar" accept="image/png, image/jpeg"
                   aria-describedby="avatar-hint avatar-error">
          </div>
          <p id="avatar-hint" class="hint">
            <img src="../assets/images/icon-info.svg" alt="" aria-hidden="true">
            Upload your photo (JPG or PNG, max size: 500KB).
          </p>
          <p id="avatar-error" class="error" role="alert"></p>
        </div>

        <div class="field">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="full-name" autocomplete="name"
                 aria-describedby="name-error">
          <p id="name-error" class="error" role="alert"></p>
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input type="text" id="email" name="email" placeholder="example@email.com"
                 autocomplete="email" aria-describedby="email-error">
          <p id="email-error" class="error" role="alert"></p>
        </div>

        <div class="field">
          <label for="github">GitHub Username</label>
          <input type="text" id="github" name="github" placeholder="@yourusername"
                 aria-describedby="github-error">
          <p id="github-error" class="error" role="alert"></p>
        </div>

        <button type="submit" class="btn">Generate My Ticket</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Coding Conf.</p>
  </footer>

  <script src="js/validation.js"></script>
</body>
</html>
